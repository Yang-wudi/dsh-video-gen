name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm test
      # NOTE: never run `pnpm run build` in CI — lib/*.js bundles are
      # hand-maintained and `tsc` would overwrite them. See CONTRIBUTING.md.
